# PostgreSQL production untuk VPS pilot SILAPOR.
# - Bind HANYA ke 127.0.0.1 (tidak terekspos ke internet).
# - POSTGRES_PASSWORD wajib; compose gagal bila kosong (tidak ada default).
# - Garage TIDAK dijalankan di VPS: lampiran disimpan di Cloudflare R2.
# Pakai:
#   sudo docker compose -p silapor-prod -f infra/vps/docker-compose.yml \
#     --env-file /etc/silapor/silapor.env up -d
name: silapor-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: silapor
      POSTGRES_USER: silapor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - silapor-pgdata:/var/lib/postgresql/data
    # Batasi memori agar build Vite tetap punya ruang di VPS 2 GB.
    shm_size: 128mb
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U silapor -d silapor']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  silapor-pgdata:
    name: silapor-pgdata
