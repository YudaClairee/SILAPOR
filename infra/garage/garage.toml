# Garage single-node config for the SILAPOR pilot (dev only).
#
# Used by the `garage` service in docker-compose.yml with:
#   /garage server --single-node --default-bucket
# so layout, access key, and bucket are auto-provisioned from the
# GARAGE_DEFAULT_* env vars (no manual `layout assign` needed).
#
# Secrets below are DEV-ONLY defaults, same treatment as
# POSTGRES_PASSWORD=silapor in compose: safe to commit for local pilot,
# MUST be replaced on any shared/staging host.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# 64 hex chars (32 bytes). DEV ONLY — generate with `openssl rand -hex 32`.
rpc_secret = "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
